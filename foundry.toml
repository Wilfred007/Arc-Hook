[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]
via_ir = true
ffi = true

[rpc_endpoints]
unichain = "https://sepolia.unichain.org"
reactive = "https://rpc.kopli.reactive.network"
